# =============================================================================
# BenchDash — local system profile dashboard
# JorahOne LLC
# =============================================================================
services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: jorahone/benchdash:latest
    container_name: benchdash
    ports:
      - "${DASHBOARD_PORT:-8081}:8081"
    environment:
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8081
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
