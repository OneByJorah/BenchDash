# ============================================================================
# BenchDash — LLM benchmarking platform
# JorahOne
#
# Auto-discover models → Run multi-dimensional tests → Rank & score → Visualize
# NOTE: backend server not yet implemented; this scaffolding is not functional.
# ============================================================================

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: jorahone/benchdash:latest
    container_name: benchdash
    ports:
      - "${DASHBOARD_PORT:-8081}:${DASHBOARD_PORT:-8081}"
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-host.docker.internal:11434}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-8081}
      - DASHBOARD_HOST=${DASHBOARD_HOST:-0.0.0.0}
      - BENCH_SKIP_MEDIA=${BENCH_SKIP_MEDIA:-0}
    volumes:
      # Persist benchmark results
      - benchmark-data:/app/results
      # Mount Docker socket for container-aware benchmarks (optional)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${DASHBOARD_PORT:-8081}/api/summary"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  benchmark-data:
